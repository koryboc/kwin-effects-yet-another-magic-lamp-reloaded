name: Build (Ubuntu)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:rolling

    steps:
      - name: Update system
        run: apt update && apt install -y bash

      - name: Check KWin version
        shell: bash
        run: |
          version=$(apt-cache policy kwin-dev | grep Candidate | grep -oP '\d+\.\d+' | head -1)
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          echo "Available kwin-dev: $version"
          if [[ -z "$major" ]] || [[ "$major" -lt 6 ]] || { [[ "$major" -eq 6 ]] && [[ "$minor" -lt 6 ]]; }; then
            echo "KWin $version does not meet the minimum requirement of 6.6, skipping build."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        if: env.skip != 'true'
        uses: actions/checkout@v4

      - name: Run install.sh
        if: env.skip != 'true'
        run: ./install.sh
