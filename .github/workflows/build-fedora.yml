name: Build (Fedora)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Update system
        run: dnf update -y

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run install.sh
        run: ./install.sh
