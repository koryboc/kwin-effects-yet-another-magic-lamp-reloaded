name: Build (openSUSE Tumbleweed)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed

    steps:
      - name: Refresh repositories
        run: zypper --non-interactive --gpg-auto-import-keys refresh || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run install.sh
        run: ./install.sh
