name: Build (Arch Linux)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Update system
        run: pacman -Syu --noconfirm

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run install.sh
        run: ./install.sh
